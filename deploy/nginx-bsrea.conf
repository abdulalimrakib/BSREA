# nginx for BSREA. Copy to /etc/nginx/sites-available/bsrea, link it into sites-enabled,
# then run certbot (see docs/deployment.md) to add HTTPS.
#
#   bsreabd.org         public website  -> 127.0.0.1:3004
#   admin.bsreabd.org   admin panel     -> 127.0.0.1:3001
#   both /api/...       backend         -> 127.0.0.1:3002
#
# The backend is reached through the same address as each website, so the browser never
# makes a cross-site request and the staff login cookie stays on admin.bsreabd.org only.

# www -> bare domain
server {
    listen 80;
    server_name www.bsreabd.org;
    return 301 https://bsreabd.org$request_uri;
}

# Public website
server {
    listen 80;
    server_name bsreabd.org;

    # Membership applications carry up to 10 files of 5 MB each
    client_max_body_size 60m;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Admin panel
server {
    listen 80;
    server_name admin.bsreabd.org;

    client_max_body_size 2m;

    # Optional: only let the office connect. Uncomment and put the office's public IP.
    # allow 203.0.113.10;
    # deny all;

    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
