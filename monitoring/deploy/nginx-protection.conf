# BSREA attack protection. Goes in /etc/nginx/conf.d/ (deploy/install.sh copies it and tests it first).
# Applies to every site on this server without changing the BSREA site files.

# 1. Each visitor (address) may make 30 requests a second, with bursts of up to 150 at once (a page and
#    all its images and scripts). Real visitors never reach this; floods get "429 Too Many Requests".
limit_req_zone $binary_remote_addr zone=bsrea_rate:10m rate=30r/s;
limit_req zone=bsrea_rate burst=150 nodelay;
limit_conn_zone $binary_remote_addr zone=bsrea_conn:10m;
limit_conn bsrea_conn 60;
limit_req_status 429;
limit_conn_status 429;

# 2. Addresses the monitoring dashboard has blocked for attacking (probing for .php/.env files, guessing staff
#    passwords, flooding): one request a minute, everything else refused. The list updates itself and
#    each block ends on its own (1 hour, longer for repeat attackers); unblock early from the Security page.
map $remote_addr $bsrea_blocked {
    default "";
    include /srv/bsrea/monitoring/data/blocklist.map;
}
limit_req_zone $bsrea_blocked zone=bsrea_blocked:1m rate=1r/m;
limit_req zone=bsrea_blocked;

# 3. Slow-connection attacks (holding connections open by sending very slowly)
client_header_timeout 15s;
client_body_timeout 30s;
send_timeout 30s;

# 4. Don't advertise the nginx version
server_tokens off;
