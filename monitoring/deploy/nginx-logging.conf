# BSREA monitoring: one JSON line per request, read by the monitoring dashboard (visits, speed, errors).
# Goes in /etc/nginx/conf.d/ (deploy/install.sh copies it). It applies to every site on this server
# without changing the BSREA site file: nginx keeps writing its normal access.log as well.
#
# rsc and pf tell real in-app page changes apart from Next.js prefetches.

log_format bsrea_json escape=json '{"t":"$time_iso8601","h":"$host","ip":"$remote_addr","m":"$request_method",'
  '"u":"$request_uri","s":$status,"b":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent",'
  '"rsc":"$http_rsc","pf":"$http_next_router_prefetch"}';

access_log /var/log/nginx/bsrea.access.log bsrea_json;
