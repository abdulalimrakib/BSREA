# The monitoring dashboard at its own address. deploy/install.sh puts your domain in place of
# MONITOR_DOMAIN, copies this to /etc/nginx/sites-available/bsrea-monitor and enables it.
# Then add HTTPS:  sudo certbot --nginx -d MONITOR_DOMAIN

server {
    listen 80;
    server_name MONITOR_DOMAIN;

    # Optional: only let the office connect. Uncomment and put the office's public IP.
    # allow 203.0.113.10;
    # deny all;

    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
